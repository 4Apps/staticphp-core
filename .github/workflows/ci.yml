name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is composer.json's "php": ">=8.4", which is also what docker/Dockerfile
        # builds; the second entry keeps us honest against the current release
        php: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # intl is required by ExtendedDateTime and the i18n formatter; the rest match
          # docker/Dockerfile. pdo_sqlite backs the migration and i18n integration tests -
          # they run against a real database in a temp file, so no service container is
          # needed
          extensions: intl, mbstring, xml, zip, bcmath, pdo_pgsql, pdo_mysql, pdo_sqlite
          coverage: none

      - name: Cache composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run code tests
        run: ./scripts/code_tests.bash

  # The package's whole point is that twig is optional. Nothing else proves it stays that
  # way: the suite above installs twig as a dev dependency, so a hard reference to a Twig
  # class would pass there and fail for an api-only consumer.
  no-twig:
    name: Boots without twig
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, xml, zip, bcmath, pdo_sqlite
          coverage: none

      - name: Install without twig
        run: composer install --no-interaction --no-progress --no-dev

      - name: Boot the framework with no view engine
        run: php scripts/boot_without_twig.php
